<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anish Link Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen font-['Inter'] selection:bg-indigo-500/30">
    <div class="max-w-4xl mx-auto px-6 py-12 md:py-20">
        <header class="mb-16">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2.5 bg-indigo-600 rounded-xl">
                    <i data-lucide="link" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-['Outfit'] font-bold tracking-tight">Anish Link Shortener</h1>
            </div>
            <p class="text-zinc-400 text-lg">Manage your short links with ease and speed.</p>
        </header>

        <section class="mb-16">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                <form id="shorten-form" class="grid grid-cols-1 md:grid-cols-[1fr,2fr,auto] gap-4">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-zinc-500 ml-1">Short Code</label>
                        <input type="text" id="code" placeholder="gh" required
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder:text-zinc-700">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-zinc-500 ml-1">Destination URL</label>
                        <input type="url" id="url" placeholder="https://github.com/anish7" required
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder:text-zinc-700">
                    </div>
                    <div class="flex items-end">
                        <button type="submit"
                            class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl px-8 py-3 transition-all flex items-center justify-center gap-2 group">
                            <span>Add Link</span>
                            <i data-lucide="plus" class="w-5 h-5 group-hover:rotate-90 transition-transform"></i>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-xl font-['Outfit'] font-semibold">Active Links</h2>
                <span id="link-count"
                    class="text-xs font-medium bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full uppercase tracking-wider">0
                    Links</span>
            </div>

            <div id="links-container" class="space-y-3">
                <!-- Links will be injected here -->
                <div class="flex items-center justify-center py-20 text-zinc-600">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
